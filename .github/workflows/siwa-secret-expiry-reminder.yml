name: SIWA client_secret expiry reminder

# Opens (or refreshes) a GitHub issue 30 days before the Sign-in-with-Apple
# client_secret JWT expires, so the rotation runbook gets actioned before
# logins break. This workflow only READS docs/auth/last-rotated.txt and opens
# an issue — it never touches the .p8 key and never signs a JWT (that is a
# human step, by design; see docs/auth/sign-in-with-apple-rotation.md).

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Evaluate expiry and open reminder issue if needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'docs/auth/last-rotated.txt';
            if (!fs.existsSync(path)) {
              core.warning(`${path} not found — cannot check SIWA secret expiry.`);
              return;
            }
            const text = fs.readFileSync(path, 'utf8');
            const expMatch = text.match(/^\s*exp\s*=\s*(\d+)\s*$/m);
            const exp = expMatch ? parseInt(expMatch[1], 10) : 0;

            const REMIND_WINDOW_DAYS = 30;
            const nowSec = Math.floor(Date.now() / 1000);
            const daysLeft = Math.floor((exp - nowSec) / 86400);
            const title = 'Rotate Sign-in-with-Apple client_secret (expiry approaching)';

            if (exp === 0) {
              core.notice('SIWA secret has never been recorded (exp=0). ' +
                'Run the rotation runbook and record iat/exp in docs/auth/last-rotated.txt.');
              return;
            }
            if (daysLeft > REMIND_WINDOW_DAYS) {
              core.notice(`SIWA client_secret OK — ${daysLeft} days until expiry. No reminder needed.`);
              return;
            }

            const expDate = new Date(exp * 1000).toISOString().slice(0, 10);
            const body = [
              `The Sign-in-with-Apple \`client_secret\` JWT expires on **${expDate}** ` +
                `(**${daysLeft} day(s) left**).`,
              '',
              'If it lapses, **all Sign-in-with-Apple logins fail silently.**',
              '',
              'Action: follow [`docs/auth/sign-in-with-apple-rotation.md`]' +
                '(../blob/HEAD/docs/auth/sign-in-with-apple-rotation.md), ' +
                'then update `docs/auth/last-rotated.txt` with the new `iat`/`exp` and commit it.',
              '',
              '_Opened automatically by `.github/workflows/siwa-secret-expiry-reminder.yml`._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'siwa-rotation',
            });
            if (existing.data.length > 0) {
              const num = existing.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: num,
                body: `Reminder refresh: **${daysLeft} day(s)** until expiry (${expDate}).`,
              });
              core.notice(`Refreshed existing rotation issue #${num}.`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['siwa-rotation'],
            });
            core.notice(`Opened rotation reminder issue #${created.data.number}.`);
