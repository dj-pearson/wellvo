name: iOS Unit Tests

# Fast feedback loop for the iOS app: compiles the app target (which now
# implicitly builds the DailyOKNotificationService extension via its embed
# dependency) and runs the DailyOKTests unit-test bundle on a simulator.
#
# This runs on feature/integration branch pushes — BEFORE a release build —
# so project-structure regressions (e.g. a broken project.pbxproj) and unit
# test failures surface without waiting for the App Store deploy workflow,
# which only runs on `main`. No code signing / secrets required: it builds
# for the simulator with signing disabled and exercises pure-logic tests.

on:
  push:
    branches:
      - 'develop'
      - 'feat/**'
      - 'claude/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-unit-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Build + Unit Tests (Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DailyOK.xcodeproj \
            -scheme DailyOK

      - name: Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          " 2>/dev/null || true)

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found, creating one..."
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in reversed(data['runtimes']):
              if 'iOS' in r['name'] and r['isAvailable']:
                  print(r['identifier'])
                  sys.exit(0)
          ")
            DEVICE_ID=$(xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DailyOK.xcodeproj \
            -scheme DailyOK \
            -destination "id=${{ env.DEVICE_ID }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DailyOK.xcodeproj \
            -scheme DailyOK \
            -destination "id=${{ env.DEVICE_ID }}" \
            -only-testing:DailyOKTests \
            -resultBundlePath "$RUNNER_TEMP/UnitTestResults.xcresult" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/UnitTestResults.xcresult
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "${{ env.DEVICE_ID }}" 2>/dev/null || true
