name: iOS E2E Tests

on:
  pull_request:
    # Features merge into develop, so run iOS tests on develop PRs too — not
    # just main — otherwise feature PRs get zero iOS coverage (US-IOS092).
    branches: [main, develop]
    paths:
      - 'ios/**'
      - 'edge-functions/**'
      - '.github/workflows/ios-e2e-tests.yml'
  workflow_dispatch:

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint iOS sources
        # Runs from the REPOSITORY ROOT, deliberately. .swiftlint.yml's
        # `included:` entries are repo-root-relative ("ios/DailyOK", …), and
        # this step used to run with working-directory: ios, where those resolve
        # against the wrong base ("ios/ios/DailyOK"). A path that matches nothing
        # is not an error to SwiftLint — it lints zero files, reports zero
        # violations, and the step goes green. A gate that inspects nothing is
        # not a gate.
        #
        # Non-strict: warnings don't fail the build yet, but rules configured as
        # errors (force_cast, force_try) gate CI (US-IOS092).
        run: |
          set -o pipefail
          swiftlint lint --config .swiftlint.yml 2>&1 | tee "$RUNNER_TEMP/swiftlint.log"

      - name: Assert SwiftLint actually inspected the iOS sources
        # The guard for the failure above: whatever the path semantics, a run
        # that linted 0 files must be red. SwiftLint's summary line carries the
        # count it linted.
        #
        # Deliberately tolerant of a wording change: if the count cannot be
        # found at all, this warns instead of failing, because breaking every
        # iOS PR on a SwiftLint release note would be worse than the gap it
        # guards. A count that IS found and is zero is unambiguous, and fails.
        run: |
          COUNT=$(grep -oE 'in [0-9]+ files' "$RUNNER_TEMP/swiftlint.log" | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$COUNT" ]; then
            echo "::warning::Could not read a file count from SwiftLint's output — the non-empty guard needs updating."
            exit 0
          fi
          echo "SwiftLint linted $COUNT files."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::SwiftLint linted 0 files. The 'included:' paths in .swiftlint.yml do not resolve from the directory this step runs in, so the lint gate is inspecting nothing."
            exit 1
          fi

  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          domain: "https://env.dpearsonmedia.com"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "dailyok"
          export-type: "env"

      - name: Install dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: Run API integration tests
        working-directory: e2e-tests
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          EDGE_FUNCTIONS_URL: https://functions.dailyok.net
          APPLE_OWNER_DEMO_EMAIL: ${{ env.APPLE_OWNER_DEMO_EMAIL }}
          APPLE_OWNER_DEMO_PASS: ${{ env.APPLE_OWNER_DEMO_PASS }}
          APPLE_RECEIVER_DEMO_EMAIL: ${{ env.APPLE_RECEIVER_DEMO_EMAIL }}
          APPLE_RECEIVER_DEMO_PASS: ${{ env.APPLE_RECEIVER_DEMO_PASS }}
        run: npm test

  ios-ui-tests:
    name: iOS UI Tests (Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.7
        with:
          domain: "https://env.dpearsonmedia.com"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: "prod"
          project-slug: "dailyok"
          export-type: "env"

      - name: Select Xcode version
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v beta | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Inject build configuration
        run: |
          # Write minimal xcconfig for simulator build (no code signing needed)
          {
            echo "// Daily OK Build Configuration (CI E2E Tests)"
            echo "CODE_SIGN_STYLE = Automatic"
            echo "CODE_SIGN_IDENTITY = -"
            echo "PRODUCT_BUNDLE_IDENTIFIER = com.wellvo.ios"
          } > ios/DailyOK/BuildConfig.xcconfig

          # Write Supabase config to Info.plist
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_URL ${{ env.SUPABASE_URL }}" ios/DailyOK/Info.plist
          /usr/libexec/PlistBuddy -c "Set :SUPABASE_ANON_KEY ${{ env.SUPABASE_ANON_KEY }}" ios/DailyOK/Info.plist

      - name: Resolve Swift Package dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DailyOK.xcodeproj \
            -scheme DailyOK

      - name: Boot iOS Simulator
        run: |
          # Find an iPhone simulator
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          " 2>/dev/null || true)

          if [ -z "$DEVICE_ID" ]; then
            echo "No available iPhone simulator found, creating one..."
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for r in reversed(data['runtimes']):
              if 'iOS' in r['name'] and r['isAvailable']:
                  print(r['identifier'])
                  sys.exit(0)
          ")
            DEVICE_ID=$(xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME")
          fi

          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
          echo "Booting simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          # No `|| true`: a broken compile must fail the job (US-IOS092).
          # pipefail makes xcodebuild's exit code win over xcbeautify's.
          xcodebuild build-for-testing \
            -project DailyOK.xcodeproj \
            -scheme DailyOK \
            -destination "id=${{ env.DEVICE_ID }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Run UI Tests
        working-directory: ios
        env:
          APPLE_OWNER_DEMO_EMAIL: ${{ env.APPLE_OWNER_DEMO_EMAIL }}
          APPLE_OWNER_DEMO_PASS: ${{ env.APPLE_OWNER_DEMO_PASS }}
          APPLE_RECEIVER_DEMO_EMAIL: ${{ env.APPLE_RECEIVER_DEMO_EMAIL }}
          APPLE_RECEIVER_DEMO_PASS: ${{ env.APPLE_RECEIVER_DEMO_PASS }}
        run: |
          set -o pipefail
          # No `|| true`: a failing UI test must turn CI red (US-IOS092).
          xcodebuild test-without-building \
            -project DailyOK.xcodeproj \
            -scheme DailyOK \
            -destination "id=${{ env.DEVICE_ID }}" \
            -only-testing:DailyOKUITests \
            -resultBundlePath $RUNNER_TEMP/TestResults.xcresult \
            | xcbeautify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7

      - name: Run Unit Tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project DailyOK.xcodeproj \
            -scheme DailyOK \
            -destination "id=${{ env.DEVICE_ID }}" \
            -only-testing:DailyOKTests \
            -resultBundlePath $RUNNER_TEMP/UnitTestResults.xcresult \
            | xcbeautify

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ${{ runner.temp }}/UnitTestResults.xcresult
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown "${{ env.DEVICE_ID }}" 2>/dev/null || true
