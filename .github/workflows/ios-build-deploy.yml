name: iOS Build & Deploy to App Store

# Archive, export and TestFlight upload run in the shared Pearson Media iOS
# release workflow (Pearson-Media/ios-release). This file only says what is
# particular to Daily OK. Signing is automatic: no provisioning profiles and no
# project patching, so .github/scripts/patch_signing.py is no longer used.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-deploy.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.0). Leave empty to use value from project.'
        required: false
        type: string
      upload:
        description: 'Upload to TestFlight (off = build and sign only)'
        type: boolean
        default: true
      skip_tests:
        description: 'Skip the unit-test gate (only for checking the release path itself)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The upload is gated on the unit tests, so a red ios-tests.yml run cannot
  # ship a build.
  unit-tests:
    name: Unit tests
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/ios-tests.yml

  release:
    needs: unit-tests
    if: ${{ !cancelled() && (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') }}
    uses: Pearson-Media/ios-release/.github/workflows/ios-release.yml@main
    with:
      working-directory: ios
      project: DailyOK.xcodeproj
      scheme: DailyOK
      marketing-version: ${{ inputs.version }}
      require-tag-on-branch: ""
      upload: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
      # Supabase URL, anon key and the old ASC_* names come from Daily OK's own
      # Infisical project; the shared IOS_* signing secrets below win over any
      # signing values stored there.
      infisical-project-slug: dailyok
      required-env: SUPABASE_URL SUPABASE_ANON_KEY
      # xcconfig treats "//" as a comment and would cut the anon key short, so
      # the Supabase values go straight into Info.plist.
      prepare-command: |
        set -euo pipefail
        printf '%s\n' '// Daily OK Build Configuration (CI-generated)' 'PRODUCT_BUNDLE_IDENTIFIER = com.wellvo.ios' > ios/DailyOK/BuildConfig.xcconfig
        PLIST=ios/DailyOK/Info.plist
        for key in SUPABASE_URL SUPABASE_ANON_KEY; do
          /usr/libexec/PlistBuddy -c "Set :$key ${!key}" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :$key string ${!key}" "$PLIST"
        done
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
      INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
      INFISICAL_DOMAIN: https://env.dpearsonmedia.com

  # Notify on failure: open a GitHub issue.
  notify-failure:
    needs: [unit-tests, release]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Failure: iOS Build & Deploy - ${context.sha.substring(0, 7)}`,
              body: `## Build Failure\n\n- **Workflow:** iOS Build & Deploy\n- **Branch:** ${context.ref}\n- **Commit:** ${context.sha}\n- **Build:** #${context.runNumber}\n- **Run:** [View logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\nPlease investigate and fix.`,
              labels: ['ci-failure']
            });
