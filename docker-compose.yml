###############################################################################
# Daily OK Backend — Docker Compose for Coolify Deployment
#
# This compose file runs alongside your self-hosted Supabase instance.
# Supabase itself is managed separately by Coolify's Supabase service.
# This file deploys the Edge Functions sidecar container.
#
# In Coolify:
#   1. Deploy Supabase using Coolify's built-in Supabase one-click service
#   2. Deploy this compose file as a separate Docker Compose service
#   3. Connect both to the same Docker network
###############################################################################

services:
  edge-functions:
    build:
      context: ./edge-functions
      dockerfile: Dockerfile
    container_name: dailyok-edge-functions
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-https://dailyok.net}
      - APNS_KEY_ID=${APNS_KEY_ID}
      - APNS_TEAM_ID=${APNS_TEAM_ID}
      - APNS_PRIVATE_KEY=${APNS_PRIVATE_KEY}
      - APNS_ENVIRONMENT=${APNS_ENVIRONMENT:-development}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      # Admin dashboard — AI content generation (Coolify Team Shared Variables)
      - AI_DEFAULT_PROVIDER=${AI_DEFAULT_PROVIDER:-anthropic}
      - AI_ENABLE_CACHING=${AI_ENABLE_CACHING:-true}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-60000}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL}
      - LIGHTWEIGHT_AI_MODEL=${LIGHTWEIGHT_AI_MODEL}
      - OPENAI_GLOBAL_API=${OPENAI_GLOBAL_API}
      # Admin dashboard — social publishing webhook (Make.com)
      - SOCIAL_WEBHOOK_URL=${SOCIAL_WEBHOOK_URL}
      - SOCIAL_WEBHOOK_SECRET=${SOCIAL_WEBHOOK_SECRET}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dailyok-network
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://localhost:9000/health'); const d = await r.json(); if (d.status !== 'ok') Deno.exit(1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  dailyok-network:
    external: true
    name: ${SUPABASE_NETWORK:-coolify}
